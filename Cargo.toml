[package]
name = "solar-forecast"
version = "0.1.0"
edition = "2021"
description = "Solar energy forecasts from measured history and radiation forecasts"
repository = "https://github.com/kilowattclub/solar-forecast"
readme = "README.md"
license = "MIT"
keywords = ["energy", "forecast", "electricity"]
categories = ["science"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
